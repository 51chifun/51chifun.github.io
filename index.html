<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>51chifun's blog 资源 CDN</title>
  <style>
    :root {
      --primary: #386A20;
      --on-primary: #FFFFFF;
      --primary-container: #B8F397;
      --secondary-container: #D9E7CB;
      --on-secondary-container: #131F0D;
      --surface: #FDFDF5;
      --surface-low: #F7F6EE;
      --surface-container: #F1F1E9;
      --on-surface: #1A1C18;
      --outline: #74796D;
      --border: rgba(0, 0, 0, 0.05);
    }

    html.dark {
      --primary: #9CD67D;
      --on-primary: #0F3900;
      --primary-container: #205107;
      --secondary-container: #3B4B34;
      --on-secondary-container: #D9E7CB;
      --surface: #11140E;
      --surface-low: #191C16;
      --surface-container: #1D211A;
      --on-surface: #E2E3DC;
      --outline: #8D9386;
      --border: rgba(255, 255, 255, 0.1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--surface);
      color: var(--on-surface);
      padding: 2rem;
      line-height: 1.5;
      transition: background-color 0.3s, color 0.3s;
    }

    main {
      max-width: 64rem;
      margin: 2rem auto 0;
    }

    article {
      max-width: 48rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      background-color: var(--secondary-container);
      color: var(--on-secondary-container);
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    p {
      opacity: 0.9;
    }

    blockquote {
      padding: 1.25rem;
      border-radius: 1rem;
      border-left: 4px solid var(--primary);
      background-color: var(--surface-container);
      font-style: italic;
      font-size: 0.875rem;
    }

    .card {
      max-width: 28rem;
      border-radius: 24px;
      overflow: hidden;
      background-color: var(--surface-low);
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 100%;
      height: 12rem;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 1.5rem;
    }

    .card-body span {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.7;
      display: block;
      margin-bottom: 0.25rem;
    }

    .card-body h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .card-body p {
      font-size: 0.875rem;
      opacity: 0.8;
      margin-bottom: 1.5rem;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.8;
    }

    .btn-outline {
      border: 1px solid var(--outline);
      color: var(--primary);
    }

    .btn-filled {
      background-color: var(--primary);
      color: var(--on-primary);
    }

    #theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--secondary-container);
      color: var(--on-secondary-container);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 1.25rem;
      height: 1.25rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
  <script>
    (function() {
      if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>

  <button id="theme-toggle" aria-label="切换深浅色模式">
    <svg id="icon-sun" class="hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><path stroke-linecap="round" stroke-linejoin="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
    <svg id="icon-moon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>

  <main>
    <article>
      <div>
        <span class="badge">CDN</span>
        <h1>51chifun's blog 资源 CDN</h1>
        <p style="font-size: 0.75rem; opacity: 0.65;">CDN 主页 · 51chifun's blog</p>
      </div>

      <p>国内图床老倒闭，一些网盘防盗链教程过几天就失效了，所以还是自己折腾一下保险。</p>

      <blockquote>使用 GitHub 仓库托管图片，使用 EdgeOne CDN 加速</blockquote>

        <div class="card-body">
          <span>GitHub 仓库</span>
          <h3>图片可随意下载嵌入他人文章</h3>
          <p>无任何版权限制，文章也可以随便转载。</p>
          <div class="actions">
            <a href="https://github.com/51chifun/resources-cdn" target="_blank" rel="noopener noreferrer" class="btn btn-outline">打开 GitHub 仓库</a>
            <a href="https://51chifun.de" target="_blank" rel="noopener noreferrer" class="btn btn-filled">访问博客主站</a>
          </div>
        </div>
      </div>
    </article>
  </main>

  <script>
    const btn = document.getElementById('theme-toggle');
    const sun = document.getElementById('icon-sun');
    const moon = document.getElementById('icon-moon');
    const html = document.documentElement;

    function update() {
      if (html.classList.contains('dark')) {
        sun.classList.remove('hidden');
        moon.classList.add('hidden');
      } else {
        sun.classList.add('hidden');
        moon.classList.remove('hidden');
      }
    }
    update();

    btn.addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
      update();
    });
  </script>
</body>
</html>
