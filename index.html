<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>51chifun's blog 资源 CDN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 默认：Material Design 3 浅色绿主题 (Light Green) */
    :root {
      --md-sys-color-primary: #386A20;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #B8F397;
      --md-sys-color-on-primary-container: #042100;
      --md-sys-color-secondary-container: #D9E7CB;
      --md-sys-color-on-secondary-container: #131F0D;
      --md-sys-color-surface: #FDFDF5;
      --md-sys-color-surface-container-low: #F7F6EE;
      --md-sys-color-surface-container: #F1F1E9;
      --md-sys-color-surface-container-high: #ECEBE3;
      --md-sys-color-surface-container-highest: #E6E5DD;
      --md-sys-color-on-surface: #1A1C18;
      --md-sys-color-outline: #74796D;
    }

    /* 深色模式：当 html 标签带有 class="dark" 时生效 */
    html.dark {
      --md-sys-color-primary: #9CD67D;
      --md-sys-color-on-primary: #0F3900;
      --md-sys-color-primary-container: #205107;
      --md-sys-color-on-primary-container: #B8F397;
      --md-sys-color-secondary-container: #3B4B34;
      --md-sys-color-on-secondary-container: #D9E7CB;
      --md-sys-color-surface: #11140E;
      --md-sys-color-surface-container-low: #191C16;
      --md-sys-color-surface-container: #1D211A;
      --md-sys-color-surface-container-high: #282B24;
      --md-sys-color-surface-container-highest: #33362F;
      --md-sys-color-on-surface: #E2E3DC;
      --md-sys-color-outline: #8D9386;
    }

    body {
      /* 直接调用系统自带字体（Mac 苹方 / Win 微软雅黑 / 移动端系统默认） */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      margin: 0;
      padding: 2rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
  <script>
    // 页面加载前优先读取本地记忆或系统偏好，防止闪白屏
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body data-color-scheme="green">

  <!-- 右上角深浅色切换按钮 -->
  <button id="theme-toggle" aria-label="切换深浅色模式"
    class="fixed top-6 right-6 p-3 rounded-full shadow-sm border border-black/5 dark:border-white/10 transition hover:opacity-80 active:scale-95"
    style="background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);">
    <!-- 太阳图标（深色模式下显示，点击切回浅色） -->
    <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5"></circle>
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
    </svg>
    <!-- 月亮图标（浅色模式下显示，点击切到深色） -->
    <svg id="icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <main class="max-w-5xl mx-auto mt-8">
    <article class="max-w-3xl mx-auto space-y-6">
      <div class="space-y-2">
        <span class="inline-block px-3 py-1 rounded-full text-xs font-medium transition-colors"
          style="background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);">CDN</span>
        <h1 class="text-3xl font-bold pt-1">51chifun's blog 资源 CDN</h1>
        <p class="text-xs opacity-65">CDN 主页 · 51chifun's blog</p>
      </div>

      <p class="text-base leading-relaxed opacity-90">国内图床老倒闭，一些网盘防盗链教程过几天就失效了，所以还是自己折腾一下保险。</p>

      <blockquote class="p-5 rounded-2xl border-l-4 italic text-sm transition-colors"
        style="background-color: var(--md-sys-color-surface-container); border-color: var(--md-sys-color-primary);">
        使用 GitHub 仓库托管图片，使用 EdgeOne CDN 加速
      </blockquote>

      <!-- Material 3 Elevated 图文卡片 -->
      <div
        class="my-6 max-w-md rounded-[24px] overflow-hidden shadow-md border border-black/5 dark:border-white/10 transition hover:shadow-lg"
        style="background-color: var(--md-sys-color-surface-container-low);">
        <img
          src="/index-img.avif"
          alt="51chifun CDN Cover" class="w-full h-48 object-cover"

        <div class="p-6">
          <div class="text-xs font-medium uppercase tracking-wider opacity-70 mb-1">GitHub 仓库</div>
          <h3 class="text-xl font-bold mb-2">图片可随意下载嵌入他人文章</h3>
          <p class="text-sm opacity-80 leading-relaxed mb-6">无任何版权限制，文章也可以随便转载。</p>
          
          <!-- 按钮区 -->
          <div class="flex items-center justify-end gap-3">
            <a href="https://github.com/51chifun/resources-cdn" target="_blank" rel="noopener noreferrer"
              class="px-5 py-2 rounded-full text-xs font-medium border transition hover:opacity-80"
              style="border-color: var(--md-sys-color-outline); color: var(--md-sys-color-primary);">
              打开 GitHub 仓库
            </a>
            <a href="https://51chifun.de" target="_blank" rel="noopener noreferrer"
              class="px-5 py-2 rounded-full text-xs font-medium transition hover:opacity-90"
              style="background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);">
              访问博客主站
            </a>
          </div>
        </div>
      </div>
    </article>
  </main>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const iconSun = document.getElementById('icon-sun');
    const iconMoon = document.getElementById('icon-moon');
    const htmlEl = document.documentElement;

    // 根据当前状态更新按钮图标
    function updateIcons() {
      if (htmlEl.classList.contains('dark')) {
        iconSun.classList.remove('hidden');
        iconMoon.classList.add('hidden');
      } else {
        iconSun.classList.add('hidden');
        iconMoon.classList.remove('hidden');
      }
    }

    // 初始化图标状态
    updateIcons();

    // 点击切换深浅色并保存到本地
    toggleBtn.addEventListener('click', () => {
      htmlEl.classList.toggle('dark');
      const isDark = htmlEl.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateIcons();
    });
  </script>
</body>
</html>
